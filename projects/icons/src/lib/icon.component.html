<img
    class="ard-icon-img"
    [class.ard-icon-filled]="filled()"
    [style]="{ width: size(), height: size() }"
    [src]="getIconSrc(icon() ?? contentWrapper.innerText)"
    [alt]="getIconAlt(icon() ?? contentWrapper.innerText)"
>

<div #contentWrapper style="display:none">
    <ng-content></ng-content>
</div>
