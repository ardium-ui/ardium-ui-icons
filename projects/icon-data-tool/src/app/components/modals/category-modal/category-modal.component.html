<ard-dialog
  heading="Pick a category to apply to all items"
  confirmButtonText="Apply"
  confirmButtonAppearance="raised-strong"
  rejectButtonAppearance="raised"
  [open]="modalController.openModalType() === OpenModalType.Category"
  (reject)="modalController.closeModal()"
  (confirm)="emitResult()"
  [canConfirm]="!!category()"
  disableBackdropClose
>
  <ard-select placeholder="Category..." [items]="CATEGORY_LIST" (valueChange)="saveCategory($event)" searchable />
</ard-dialog>
