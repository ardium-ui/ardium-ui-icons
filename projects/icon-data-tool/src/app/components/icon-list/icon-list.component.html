<cdk-virtual-scroll-viewport
  [itemSize]="iconSize()"
  minBufferPx="300"
  maxBufferPx="500"
>
  <ng-container *cdkVirtualFor="let row of iconsInRows(); let index = index">
    <app-icon-row
      [icons]="row"
      (itemClick)="onItemClick($event, index)"
      (checkboxStateChange)="onCheckboxStateChange($event, index)"
    />
  </ng-container>
</cdk-virtual-scroll-viewport>
