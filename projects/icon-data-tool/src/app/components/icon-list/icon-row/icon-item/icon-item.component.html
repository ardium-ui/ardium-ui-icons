<ard-checkbox
  [(selected)]="checkboxSelected"
  (click)="onCheckboxClick($event)"
/>
<img [src]="iconSrc()" [alt]="iconData().name" />
<div class="name" [cdkCopyToClipboard]="iconData().name">
  {{ iconData().name }}
</div>
<div class="info-container">
  <div [ngClass]="'category category-' + iconData().category">
    {{ iconData().category ?? 'uncategorized' }}
  </div>
  <div class="tags">
    <ard-icon weight="700">sell</ard-icon>
    {{ iconData().tags.length }}
  </div>
</div>
